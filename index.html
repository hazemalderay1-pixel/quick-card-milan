<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صانع بطاقات تهنئة - ميلان</title>
    <!-- Google Fonts: Cairo + Al Marai -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Almarai:wght@300;400;700;800&family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;900&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css?v=2.0.0">
    <style>
        /* خيار الجنس لنموذج 2 */
        .gender-section {
            display: none;
            margin-top: 0.75rem;
            gap: 0.5rem;
        }
        .gender-section.visible {
            display: flex;
        }
        .gender-btn {
            flex: 1;
            padding: 0.55rem 0.75rem;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
        }
        .gender-btn.active {
            background: #451331;
            color: #fff;
            border-color: #451331;
        }
        .gender-btn:hover:not(.active) {
            border-color: #451331;
            color: #451331;
        }
        .gender-label {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 0.3rem;
            display: block;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <main class="app-main">
            <!-- قسم التحكم والإدخال -->
            <section class="control-panel animate-slide-right">
                <!-- كارد التنقل والبراند العلوي -->
                <div class="nav-card animate-fade-in">
                    <div class="nav-brand">
                        <img src="logo.svg?v=2.0.0" alt="ميلان" class="nav-logo">
                    </div>
                    <div class="nav-actions">
                        <button id="btnShare" class="nav-btn btn-share" title="مشاركة الموقع">
                            <i data-lucide="share-2"></i>
                        </button>
                        <button id="themeToggleBtn" class="nav-btn theme-toggle-btn" title="تبديل الوضع الليلي">
                            <i data-lucide="moon"></i>
                        </button>
                    </div>
                </div>

                <!-- رأس الصفحة -->
                <header class="header-card animate-fade-in">
                    <h1>بطاقات تهنئة<br>ميلان</h1>
                </header>

                <div class="control-card">
                    <h2 class="section-title"><i data-lucide="sliders"></i> خيارات التصميم</h2>

                    <!-- أسماء متعددة -->
                    <div class="names-section">
                        <label class="names-section-title"><i data-lucide="user"></i> الاسم على البطاقة</label>
                        <div id="namesContainer" class="names-container">
                            <!-- سيتم توليد حقول إدخال الأسماء هنا برمجياً -->
                        </div>
                    </div>

                    <!-- خيار الجنس (يظهر فقط في النموذج 2) -->
                    <div id="genderSection" class="gender-section">
                        <div style="width:100%;">
                            <span class="gender-label">نوع المعايدة:</span>
                            <div style="display:flex; gap:0.5rem;">
                                <button class="gender-btn active" id="genderMale" data-gender="male">ذكر (اخوكم)</button>
                                <button class="gender-btn" id="genderFemale" data-gender="female">أنثى (اختكم)</button>
                            </div>
                        </div>
                    </div>

                    <!-- اختيار النموذج -->
                    <div class="template-selector">
                        <label><i data-lucide="image"></i> اختر نموذج البطاقة</label>
                        <div class="templates-grid" id="templatesGrid">
                            <!-- سيتم توليد النماذج هنا -->
                        </div>
                    </div>

                    <!-- خيارات الخط والموضع -->
                    <div class="settings-accordion">
                        <h3 class="accordion-title"><i data-lucide="sliders"></i> خيارات الخط والموضع <i data-lucide="chevron-down" class="arrow-icon"></i></h3>

                        <div class="accordion-content">
                            <!-- خصائص الخط -->
                            <div class="properties-grid">
                                <div class="select-group">
                                    <label for="nameFont">نوع الخط</label>
                                    <select id="nameFont" class="custom-select">
                                        <option value="Almarai">المراعي (Almarai)</option>
                                        <option value="Cairo">Cairo (عصري)</option>
                                        <option value="Amiri">Amiri (خط أميري فخم)</option>
                                        <option value="Tajawal">Tajawal (ناعم)</option>
                                    </select>
                                </div>
                                <div class="select-group">
                                    <label for="nameSize">حجم الخط</label>
                                    <input type="range" id="nameSize" min="20" max="130" value="90" class="custom-range">
                                </div>
                            </div>

                            <!-- الموقع الأفقي والعمودي -->
                            <div class="range-controls-wrapper">
                                <div class="sub-range-group">
                                    <div class="range-labels">
                                        <span>الموقع الأفقي (X)</span>
                                        <span id="nPosXVal">87%</span>
                                    </div>
                                    <input type="range" id="nPosX" min="5" max="95" value="87">
                                </div>
                                <div class="sub-range-group">
                                    <div class="range-labels">
                                        <span>الموقع الرأسي (Y)</span>
                                        <span id="nPosYVal">40%</span>
                                    </div>
                                    <input type="range" id="nPosY" min="5" max="95" value="40">
                                </div>
                            </div>

                            <!-- لون الاسم -->
                            <div class="color-picker-section">
                                <span>لون خط الاسم:</span>
                                <div class="colors-grid" id="nameColors">
                                    <button class="color-btn active" data-color="#FFFFFF" style="background-color: #FFFFFF; border: 1px solid #ccc;"></button>
                                    <button class="color-btn" data-color="#451331" style="background-color: #451331;"></button>
                                    <button class="color-btn" data-color="#D4AF37" style="background-color: #D4AF37;"></button>
                                    <button class="color-btn" data-color="#000000" style="background-color: #000000; border: 1px solid #fff;"></button>
                                    <input type="color" id="nCustomColor" value="#FFFFFF">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- أزرار الإجراءات -->
                    <div class="action-buttons">
                        <button id="btnPreview" class="btn btn-secondary">
                            <i data-lucide="eye"></i> عرض ومعاينة
                        </button>
                        <button id="btnDownload" class="btn btn-primary">
                            <i data-lucide="download"></i> تحميل البطاقة
                        </button>
                    </div>
                </div>
            </section>

            <!-- قسم المعاينة -->
            <section class="preview-panel animate-slide-left">
                <div class="canvas-container">
                    <canvas id="cardCanvas" width="1080" height="1080"></canvas>
                </div>
                <div class="drag-hint">
                    <i data-lucide="move" class="animate-pulse"></i> اسحب الاسم مباشرة لتغيير مكانه على البطاقة
                </div>
            </section>
        </main>

        <!-- نافذة المعاينة الكبيرة (Modal) -->
        <div id="previewModal" class="modal">
            <div class="modal-content control-card">
                <span class="close-modal">&times;</span>
                <h3>جاهزة للتحميل والتنزيل</h3>
                <p style="color: var(--text-light); font-size: 0.9rem; margin-bottom: 1.5rem;">انقر على تحميل الآن لحفظ الصورة بدقة عالية</p>
                <div class="modal-body">
                    <img id="modalImage" src="" alt="البطاقة النهائية">
                </div>
                <div class="modal-actions">
                    <button id="modalBtnDownload" class="btn btn-primary">
                        <i data-lucide="download"></i> تحميل الآن
                    </button>
                </div>
            </div>
        </div>

        <footer class="app-footer">
            <p>كل عام وأنتم بخير &copy; 2026</p>
        </footer>
    </div>

    <script src="script.js?v=2.0.0"></script>
</body>
</html>
